<html lang="ko">
<head>
	<meta http-equiv="content-type" content="text/html;charset=UTF-8" />
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="keywords" content="">
	<meta name="description" content="">
	<title>사용자목록</title>
	<link href="../css/bootstrap.min5e7a.css?v=3.3.7" rel="stylesheet"/>
	<link href="../css/font-awesome.mind6e8.css?v=4.7.3" rel="stylesheet"/>
	<!-- bootstrap-table 시트플러그인스타일 -->
	<link href="../ajax/libs/bootstrap-table/bootstrap-table.min47d3.css?v=1.18.3" rel="stylesheet"/>
	<link href="../css/animate.min9b79.css?v=20210831" rel="stylesheet"/>
	<link href="../css/style.min9b79.css?v=20210831" rel="stylesheet"/>
	<link href="../illeesam/css/illeesam_ui.css?v=4.7.3" rel="stylesheet"/>
    <link href="../ajax/libs/jquery-layout/jquery.layout-latest1cc4.css?v=1.4.4" rel="stylesheet"/>
    <link href="../ajax/libs/jquery-ztree/3.5/css/metro/zTreeStyle.css" rel="stylesheet"/>
</head>
<body class="gray-bg">
	<div class="ui-layout-west">
		<div class="box box-main">
			<div class="box-header">
				<div class="box-title">
					<i class="fa icon-grid"></i> 조직
				</div>
				<div class="box-tools pull-right">
				    <a type="button" class="btn btn-box-tool" href="#" onclick="dept()" title="관리부서"><i class="fa fa-edit"></i></a>
					<button type="button" class="btn btn-box-tool" id="btnExpand" title="확장" style="display:none;"><i class="fa fa-chevron-up"></i></button>
					<button type="button" class="btn btn-box-tool" id="btnCollapse" title="축소"><i class="fa fa-chevron-down"></i></button>
					<button type="button" class="btn btn-box-tool" id="btnRefresh" title="새로고침부서"><i class="fa fa-refresh"></i></button>
				</div>
			</div>
			<div class="ui-layout-content">
				<div id="tree" class="ztree"></div>
			</div>
		</div>
	</div>
	
	<div class="ui-layout-center">
		<div class="container-div">
			<div class="row">
				<div class="col-sm-12 search-collapse">
					<form id="user-form">
						<input type="hidden" id="deptId" name="deptId">
		                <input type="hidden" id="parentId" name="parentId">
						<div class="select-list">
							<ul>
								<li>
									사용자명:<input type="text" name="loginName"/>
								</li>
								<li>
									핸드폰번호:<input type="text" name="phonenumber"/>
								</li>
								<li>
									사용자상태:<select name="status">
										<option value="">-없음-</option>
										<option value="0">정상</option>
										<option value="1">숨김</option>
									</select>
								</li>
								<li class="select-time">
									<label>생성시간: </label>
									<input type="text" class="time-input" id="startTime" placeholder="시작시간" name="params[beginTime]"/>
									<span>-</span>
									<input type="text" class="time-input" id="endTime" placeholder="종료시간" name="params[endTime]"/>
								</li>
								<li>
									<a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;검색</a>
								    <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;초기화</a>
								</li>
							</ul>
						</div>
					</form>
				</div>
				
		        <div class="btn-group-sm" id="toolbar" role="group">
		        	<a class="btn btn-success" onclick="$.operate.addTab()">
		                <i class="fa fa-plus"></i> 신규
		            </a>
		             <a class="btn btn-primary single disabled" onclick="$.operate.editTab()">
			            <i class="fa fa-edit"></i> 수정
			        </a>
		            <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()">
		                <i class="fa fa-remove"></i> 삭제
		            </a>
		            <a class="btn btn-info" onclick="$.table.importExcel()">
			            <i class="fa fa-upload"></i> import
			        </a>
		            <a class="btn btn-warning" onclick="$.table.exportExcel()">
			            <i class="fa fa-download"></i> 내려받기
			        </a>
		        </div>
		        
		        <div class="col-sm-12 select-table table-striped">
				    <table id="bootstrap-table"></table>
				</div>
			</div>
		</div>
	</div>
    <script> var ctx = "#\/"; var lockscreen = null; if(lockscreen){window.top.location=ctx+"lockscreen";} </script>
    <a id="scroll-up" href="#" class="btn btn-sm display"><i class="fa fa-angle-double-up"></i></a>
	<script src="../js/jquery.min45e0.js?v=3.6.0"></script>
	<script src="../js/bootstrap.min5e7a.js?v=3.3.7"></script>
	<!-- bootstrap-table 시트플러그인 -->
	<script src="../ajax/libs/bootstrap-table/bootstrap-table.min47d3.js?v=1.18.3"></script>
	<script src="../ajax/libs/bootstrap-table/locale/bootstrap-table-zh-CN.min47d3.js?v=1.18.3"></script>
	<script src="../ajax/libs/bootstrap-table/extensions/mobile/bootstrap-table-mobile47d3.js?v=1.18.3"></script>
	<!-- jquery-validate Form검증플러그인 -->
	<script src="../ajax/libs/validate/jquery.validate.minb667.js?v=1.19.3"></script>
	<script src="../ajax/libs/validate/jquery.validate.extendb667.js?v=1.19.3"></script>
	<script src="../ajax/libs/validate/messages_zhb667.js?v=1.19.3"></script>
	<!-- bootstrap-table 시트트리플러그인 -->
	<script src="../ajax/libs/bootstrap-table/extensions/tree/bootstrap-table-tree.min47d3.js?v=1.18.3"></script>
	<!-- loading -->
	<script src="../ajax/libs/blockUI/jquery.blockUIf002.js?v=2.70.0"></script>
    <script src="../ajax/libs/iCheck/icheck.min2c70.js?v=1.0.3"></script>
	<script src="../ajax/libs/layer/layer.minc011.js?v=3.5.1"></script>
	<script src="../ajax/libs/layui/layui.min751e.js?v=2.6.8"></script>
	<script src="../illeesam/js/illeesam_comn.js?v=4.7.3"></script>
	<script src="../illeesam/js/illeesam-ui.js?v=4.7.3"></script>

	
    <script src="../ajax/libs/jquery-layout/jquery.layout-latest1cc4.js?v=1.4.4"></script>

	
    <script src="../ajax/libs/jquery-ztree/3.5/js/jquery.ztree.all-3.5.js"></script>
	<script>
		var editFlag = "";
		var removeFlag = "";
		var resetPwdFlag = "";
		var prefix = ctx + "system/user";

		$(function() {
		    var panehHidden = false;
		    if ($(this).width() < 769) {
		        panehHidden = true;
		    }
		    $('body').layout({ initClosed: panehHidden, west__size: 185 });
	     	// 뒤맨위묶다
	    	if ($.fn.toTop !== undefined) {
	    		var opt = {
	    			win:$('.ui-layout-center'),
	    			doc:$('.ui-layout-center')
	    		};
	    		$('#scroll-up').toTop(opt);
	    	}
		    queryUserList();
		    queryDeptTree();
		});

		function queryUserList() {
		    var options = {
		        url: prefix + "/list",
		        createUrl: prefix + "/add",
		        updateUrl: prefix + "/edit/{id}",
		        removeUrl: prefix + "/remove",
		        exportUrl: prefix + "/export",
		        importUrl: prefix + "/importData",
		        importTemplateUrl: prefix + "/importTemplate",
		        sortName: "createTime",
		        sortOrder: "desc",
		        modalName: "사용자",
		        columns: [{
		            checkbox: true
		        },
		        {
		            field: 'userId',
		            title: '사용자ID'
		        },
		        {
		            field: 'loginName',
		            title: '사용자명',
		            sortable: true
		        },
		        {
		            field: 'userName',
		            title: '사용자이름'
		        },
		        {
		            field: 'dept.deptName',
		            title: '부서'
		        },
		        {
		            field: 'email',
		            title: '이메일',
		            visible: false
		        },
		        {
		            field: 'phonenumber',
		            title: '휴대전화'
		        },
		        {
		        	visible: editFlag == 'hidden' ? false : true,
		        	title: '사용자상태',
		        	align: 'center',
		        	formatter: function (value, row, index) {
		        		return statusTools(row);
		        	}
		        },
		        {
		            field: 'createTime',
		            title: '생성시간',
		            sortable: true
		        },
		        {
		            title: '동작',
		            align: 'center',
		            formatter: function(value, row, index) {
		                if (row.userId != 1) {
		                	var actions = [];
			                actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.editTab(\'' + row.userId + '\')"><i class="fa fa-edit"></i>수정</a> ');
			                actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.userId + '\')"><i class="fa fa-remove"></i>삭제</a> ');
			                var more = [];
			                more.push("<a class='btn btn-default btn-xs " + resetPwdFlag + "' href='javascript:void(0)' onclick='resetPwd(" + row.userId + ")'><i class='fa fa-key'></i>비밀번호 재설정</a> ");
			                more.push("<a class='btn btn-default btn-xs " + editFlag + "' href='javascript:void(0)' onclick='authRole(" + row.userId + ")'><i class='fa fa-check-square-o'></i>역할 할당</a>");
			                actions.push('<a tabindex="0" class="btn btn-info btn-xs" role="button" data-container="body" data-placement="left" data-toggle="popover" data-html="true" data-trigger="hover" data-content="' + more.join('') + '"><i class="fa fa-chevron-circle-right"></i>더보기운영</a>');
			                return actions.join('');
		            	} else {
		                    return "";
		                }
		            }
		        }]
		    };
		    $.table.init(options);
		}
		
		function queryDeptTree()
		{
			var url = ctx + "system/dept/treeData";
			var options = {
		        url: url,
		        expandLevel: 2,
		        onClick : zOnClick
		    };
			$.tree.init(options);
			
			function zOnClick(event, treeId, treeNode) {
				$("#deptId").val(treeNode.id);
				$("#parentId").val(treeNode.pId);
				$.table.search();
			}
		}
		
		$('#btnExpand').click(function() {
			$._tree.expandAll(true);
		    $(this).hide();
		    $('#btnCollapse').show();
		});
		
		$('#btnCollapse').click(function() {
			$._tree.expandAll(false);
		    $(this).hide();
		    $('#btnExpand').show();
		});
		
		$('#btnRefresh').click(function() {
			queryDeptTree();
		});

		/* 사용자관리-부서 */
		function dept() {
			var url = ctx + "system/dept";
			$.modal.openTab("부서관리", url);
		}

		/* 사용자관리-비밀번호 재설정 */
		function resetPwd(userId) {
		    var url = prefix + '/resetPwd/' + userId;
		    $.modal.open("%eb%b9%84%eb%b0%80%eb%b2%88%ed%98%b8%20%ec%9e%ac%ec%84%a4%ec%a0%95.html", url, '800', '300');
		}
		
		/* 사용자관리-역할 할당 */
		function authRole(userId) {
		    var url = prefix + '/authRole/' + userId;
		    $.modal.openTab("사용자역할 할당", url);
		}
		
		/* 사용자상태보여줌 */
		function statusTools(row) {
		    if (row.status == 1) {
    			return '<i class=\"fa fa-toggle-off text-info fa-2x\" onclick="enable(\'' + row.userId + '\')"></i> ';
    		} else {
    			return '<i class=\"fa fa-toggle-on text-info fa-2x\" onclick="disable(\'' + row.userId + '\')"></i> ';
    		}
		}
		
		/* 사용자관리-비정상 */
		function disable(userId) {
			$.modal.confirm("확인비정상사용자?", function() {
				$.operate.post(prefix + "/changeStatus", { "userId": userId, "status": 1 });
		    })
		}

		/* 사용자관리활성 */
		function enable(userId) {
			$.modal.confirm("확인활성사용자?", function() {
				$.operate.post(prefix + "/changeStatus", { "userId": userId, "status": 0 });
		    })
		}
	</script>
</body>

<form enctype="multipart/form-data" class="mt20 mb10">
	<div class="col-xs-offset-1">

		<div class="mt10 pt5">
			<input type="checkbox" id="updateSupport" name="updateSupport" title="만약 로그인계정이미존재,변경이것데이터."> 변경된 내용이 이미 존재하는지 여부사용자데이터
			 &nbsp;	<a onclick="$.table.importTemplate()" class="btn btn-default btn-xs"><i class="fa fa-file-excel-o"></i> 다운로드테마</a>
		</div>
		<font color="red" class="pull-left mt10">
			메시지:만 허용import“xls"또는"xlsx”형식 파일!
		</font>
	</div>
</form>
</script>
</html>
